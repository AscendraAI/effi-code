name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify (syntax · unit · consistency · CLI smoke)
        # Same script as the local pre-push hook — local green must mean CI green.
        run: bash scripts/verify.sh
